name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned app
        run: |
          xcodebuild -project DuoLikeAnimation.xcodeproj -scheme DuoLikeAnimation -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry DuoLikeAnimation.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DuoLikeAnimation-IPA
          path: DuoLikeAnimation.ipa
          if-no-files-found: error
          retention-days: 7
